name: Generate 15K+ Python Fixture

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codepilot-heavy-scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate fixture
        run: python examples/generate_heavy_file.py
      - name: Commit fixture
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add examples/heavy_15000_lines.py
          git diff --cached --quiet || git commit -m 'test: generate 15k-line Python stress fixture'
          git push
