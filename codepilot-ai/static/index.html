<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodePilot AI</title><style>body{font-family:Inter,system-ui;margin:0;background:#f5f9ff;color:#10213b}.wrap{max-width:1100px;margin:40px auto;padding:24px}.hero,.panel{background:#fff;border:1px solid #dbe7f5;border-radius:24px;box-shadow:0 18px 50px #15365d12;padding:28px}.hero{margin-bottom:20px}.tag{color:#1264e8;font-weight:700}textarea{width:100%;min-height:300px;box-sizing:border-box;border:1px solid #ccd9e8;border-radius:16px;padding:16px;font:14px ui-monospace,monospace}button{margin-top:14px;border:0;border-radius:12px;padding:12px 18px;background:#1264e8;color:white;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-top:20px}.finding{padding:12px;border-bottom:1px solid #edf2f8}.score{font-size:48px;font-weight:800;color:#1264e8}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><div class="tag">CODEPILOT AI · PYTHON</div><h1>Analyze code. Find problems. Build better.</h1><p>A focused Python developer workspace MVP powered by FastAPI.</p></section><section class="grid"><div class="panel"><h2>Python Analyzer</h2><textarea id="code">def add(a, b):
    return a + b
</textarea><button onclick="analyze()">Analyze code</button></div><div class="panel"><h2>Report</h2><div class="score" id="score">—</div><div id="findings">Run an analysis to see findings.</div></div></section></main><script>async function analyze(){const code=document.getElementById('code').value;const r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});const d=await r.json();document.getElementById('score').textContent=d.score+'/100';document.getElementById('findings').innerHTML=d.findings.length?d.findings.map(x=>`<div class="finding"><b>${x.severity.toUpperCase()}</b> · ${x.code}<br>${x.message}</div>`).join(''):'<p>No findings.</p>'}</script></body></html>
